query CartInput {
  cart {
    redeemAmount: attribute(key: "loyalty_discount") {
      value
    }
    redeemAttempt: attribute(key: "loyalty_attempt") {
      value
    }
    redeemCurrency: attribute(key: "loyalty_currency") {
      value
    }
    cost {
      subtotalAmount {
        amount
        currencyCode
      }
    }
  }
  discount {
    discountClasses
  }
}
