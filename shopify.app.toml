# Shopify app configuration (shape verified against shopify.dev app-configuration
# docs, 2026-10-01). client_id and URLs are placeholders until a Partner account
# exists — `shopify app config push` after `shopify app init --template none`
# links this file to a real app.

name = "Loyalty POS Sync"
client_id = "REPLACE_WITH_CLIENT_ID"
application_url = "https://REPLACE_WITH_BACKEND_HOST/"
embedded = true
handle = "loyalty-pos-sync"

[access_scopes]
# read_orders: orders/paid + refunds/create webhooks and the reconciliation
#   query (last 60 days — enough for the hourly diff; deeper backfill would
#   need the approval-gated read_all_orders).
# read_customers: customer objects for the admin ledger view.
# write_discounts: the discount Function registration.
scopes = "read_orders,read_customers,write_discounts"

[auth]
redirect_urls = ["https://REPLACE_WITH_BACKEND_HOST/api/auth/callback"]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["orders/paid", "refunds/create", "app/uninstalled"]
uri = "/webhooks"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks"
